name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest
          pip install -r requirements.txt

      - name: Run Python syntax check
        run: python -m py_compile scripts/ci_check.py

      - name: Run pytest directly (core tests)
        timeout-minutes: 40
        run: |
          python -m pytest -q --tb=short \
            tests/test_adversarial_scenarios.py \
            tests/test_attack_and_device_scenarios.py \
            tests/test_blackbox_security.py \
            tests/test_deep_audit.py \
            tests/test_file_decrypt_aad.py \
            tests/test_logical_fixes.py \
            tests/test_research_evidence.py \
            tests/test_security_audit.py \
            tests/test_connectivity.py \
            tests/test_identity.py \
            tests/test_tier1_features.py
