[build]
  command = "mkdir -p dist && python3 dashboard_data_processor.py && cp dashboard-complete.html dist/index.html && cp dashboard.html dist/dashboard.html && cp dashboard-complete.html dist/dashboard-complete.html && cp dashboard-nist.html dist/dashboard-nist.html && cp dashboard-entropy.html dist/dashboard-entropy.html && cp dashboard-mouse.html dist/dashboard-mouse.html && cp dashboard_data.json dist/dashboard_data.json && cp 404.html dist/404.html"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; font-src 'self';"
