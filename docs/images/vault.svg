<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="860" height="260" fill="url(#bg)" rx="10"/>
  <rect width="860" height="260" fill="none" stroke="#30363d" stroke-width="1" rx="10"/>
  <text x="430" y="26" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="700" letter-spacing="1.5">HIGH-VOLTAGE VAULT — SECRET LIFECYCLE</text>

  <!-- STORE path -->
  <text x="40" y="55" fill="#3fb950" font-size="10" font-weight="700">STORE</text>
  <rect x="30" y="62" width="100" height="46" rx="5" fill="#1a3a1a" stroke="#3fb950" stroke-width="1"/>
  <text x="80" y="82" text-anchor="middle" fill="#c9d1d9" font-size="9.5">Secret bytes</text>
  <text x="80" y="96" text-anchor="middle" fill="#8b949e" font-size="9">+ master password</text>

  <line x1="130" y1="85" x2="158" y2="85" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="160" y="62" width="120" height="46" rx="5" fill="#1a3a1a" stroke="#3fb950" stroke-width="1"/>
  <text x="220" y="80" text-anchor="middle" fill="#56d364" font-size="9.5" font-weight="600">Shamir SSS</text>
  <text x="220" y="94" text-anchor="middle" fill="#c9d1d9" font-size="9">GF(2⁸) split</text>
  <text x="220" y="106" text-anchor="middle" fill="#8b949e" font-size="9">n shards / k threshold</text>

  <line x1="280" y1="85" x2="308" y2="85" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="310" y="62" width="140" height="46" rx="5" fill="#1a3a1a" stroke="#3fb950" stroke-width="1"/>
  <text x="380" y="80" text-anchor="middle" fill="#56d364" font-size="9.5" font-weight="600">Argon2id per shard</text>
  <text x="380" y="94" text-anchor="middle" fill="#c9d1d9" font-size="9">AES-256-GCM encrypt</text>
  <text x="380" y="106" text-anchor="middle" fill="#8b949e" font-size="9">unique salt per shard</text>

  <line x1="450" y1="85" x2="478" y2="85" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="480" y="62" width="130" height="46" rx="5" fill="#1a3a1a" stroke="#3fb950" stroke-width="1"/>
  <text x="545" y="80" text-anchor="middle" fill="#56d364" font-size="9.5" font-weight="600">Vault State</text>
  <text x="545" y="94" text-anchor="middle" fill="#c9d1d9" font-size="9">ARMED → HOT</text>
  <text x="545" y="106" text-anchor="middle" fill="#8b949e" font-size="9">TTL dead-man switch</text>

  <line x1="610" y1="85" x2="638" y2="85" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="640" y="62" width="120" height="46" rx="5" fill="#1a3a1a" stroke="#3fb950" stroke-width="1"/>
  <text x="700" y="80" text-anchor="middle" fill="#56d364" font-size="9.5" font-weight="600">vault_id returned</text>
  <text x="700" y="94" text-anchor="middle" fill="#c9d1d9" font-size="9">Shards distributed</text>
  <text x="700" y="106" text-anchor="middle" fill="#8b949e" font-size="9">to threshold holders</text>

  <!-- RETRIEVE path -->
  <text x="40" y="148" fill="#388bfd" font-size="10" font-weight="700">RETRIEVE</text>
  <rect x="30" y="154" width="100" height="46" rx="5" fill="#0d2137" stroke="#1f6feb" stroke-width="1"/>
  <text x="80" y="174" text-anchor="middle" fill="#c9d1d9" font-size="9.5">k shards</text>
  <text x="80" y="188" text-anchor="middle" fill="#8b949e" font-size="9">+ master password</text>

  <line x1="130" y1="177" x2="158" y2="177" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="160" y="154" width="120" height="46" rx="5" fill="#0d2137" stroke="#1f6feb" stroke-width="1"/>
  <text x="220" y="172" text-anchor="middle" fill="#79c0ff" font-size="9.5" font-weight="600">Argon2id verify</text>
  <text x="220" y="186" text-anchor="middle" fill="#c9d1d9" font-size="9">AES-GCM decrypt</text>
  <text x="220" y="198" text-anchor="middle" fill="#8b949e" font-size="9">each shard</text>

  <line x1="280" y1="177" x2="308" y2="177" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="310" y="154" width="130" height="46" rx="5" fill="#0d2137" stroke="#1f6feb" stroke-width="1"/>
  <text x="375" y="172" text-anchor="middle" fill="#79c0ff" font-size="9.5" font-weight="600">Lagrange interp.</text>
  <text x="375" y="186" text-anchor="middle" fill="#c9d1d9" font-size="9">Shamir reconstruct</text>
  <text x="375" y="198" text-anchor="middle" fill="#8b949e" font-size="9">over GF(2⁸)</text>

  <line x1="440" y1="177" x2="468" y2="177" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="470" y="154" width="120" height="46" rx="5" fill="#0d2137" stroke="#1f6feb" stroke-width="1"/>
  <text x="530" y="172" text-anchor="middle" fill="#79c0ff" font-size="9.5" font-weight="600">Secret returned</text>
  <text x="530" y="186" text-anchor="middle" fill="#c9d1d9" font-size="9">Vault → BURNED</text>
  <text x="530" y="198" text-anchor="middle" fill="#8b949e" font-size="9">(burn-after-read)</text>

  <!-- MITM Shield side panel -->
  <rect x="660" y="140" width="180" height="108" rx="6" fill="#1a1a3a" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="750" y="158" text-anchor="middle" fill="#bc8cff" font-size="10" font-weight="700">MITM SHIELD</text>
  <line x1="670" y1="163" x2="830" y2="163" stroke="#bc8cff" stroke-width="0.5" opacity="0.4"/>
  <text x="750" y="178" text-anchor="middle" fill="#c9d1d9" font-size="9.5">ML-KEM-1024 handshake</text>
  <text x="750" y="193" text-anchor="middle" fill="#c9d1d9" font-size="9.5">HKDF session key</text>
  <text x="750" y="208" text-anchor="middle" fill="#c9d1d9" font-size="9.5">AES-256-GCM payload</text>
  <text x="750" y="223" text-anchor="middle" fill="#c9d1d9" font-size="9.5">HMAC-SHA3-512 envelope</text>
  <text x="750" y="238" text-anchor="middle" fill="#8b949e" font-size="9">±5 min window · seq counter</text>

  <!-- Vault states -->
  <text x="60" y="230" fill="#8b949e" font-size="9.5" font-weight="700">VAULT STATES:</text>
  <rect x="150" y="218" width="64" height="18" rx="3" fill="#1a3a1a" stroke="#3fb950" stroke-width="0.8"/>
  <text x="182" y="231" text-anchor="middle" fill="#56d364" font-size="8.5">ARMED</text>
  <rect x="222" y="218" width="44" height="18" rx="3" fill="#3a2a00" stroke="#d29922" stroke-width="0.8"/>
  <text x="244" y="231" text-anchor="middle" fill="#e3b341" font-size="8.5">HOT</text>
  <rect x="274" y="218" width="58" height="18" rx="3" fill="#3a1a00" stroke="#f0883e" stroke-width="0.8"/>
  <text x="303" y="231" text-anchor="middle" fill="#ffa657" font-size="8.5">BURNED</text>
  <rect x="340" y="218" width="52" height="18" rx="3" fill="#1a1a3a" stroke="#8b949e" stroke-width="0.8"/>
  <text x="366" y="231" text-anchor="middle" fill="#8b949e" font-size="8.5">SEALED</text>
  <rect x="400" y="218" width="68" height="18" rx="3" fill="#3a1a1a" stroke="#f85149" stroke-width="0.8"/>
  <text x="434" y="231" text-anchor="middle" fill="#f85149" font-size="8.5">ZEROIZED</text>

  <text x="430" y="252" text-anchor="middle" fill="#484f58" font-size="9">Copyright (c) 2026 Soumodeep Guha (rock4007) · vault.py — Proprietary, All Rights Reserved</text>
</svg>
